<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" fill="none">
  <defs>
    <!-- Deep obsidian slate backdrop -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14192E"/>
      <stop offset="55%" stop-color="#0C101E"/>
      <stop offset="100%" stop-color="#070911"/>
    </linearGradient>

    <!-- Subtle ambient top light -->
    <radialGradient id="ambientGlow" cx="256" cy="120" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>

    <!-- Hairline inner bevel border -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A9CFE" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>

    <!-- Left Minecraft voxel facet gradient -->
    <linearGradient id="voxelGrad" x1="120" y1="136" x2="230" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Right Discord arc gradient -->
    <linearGradient id="discordGrad" x1="278" y1="136" x2="392" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#5865F2"/>
    </linearGradient>

    <!-- Bidirectional link gradients -->
    <linearGradient id="topLinkGrad" x1="184" y1="232" x2="328" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#8A9CFE"/>
    </linearGradient>
    <linearGradient id="botLinkGrad" x1="184" y1="280" x2="328" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#57F287"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#ambientGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Subtle architectural grid lines -->
  <g opacity="0.055" stroke="#8A9CFE" stroke-width="1">
    <line x1="128" y1="40" x2="128" y2="472"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="384" y1="40" x2="384" y2="472"/>
    <line x1="40" y1="128" x2="472" y2="128"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="384" x2="472" y2="384"/>
  </g>

  <!-- Left Voxel Half ("Minecraft" squared geometry) -->
  <path d="M 222 138 L 152 138 Q 122 138 122 168 L 122 344 Q 122 374 152 374 L 222 374"
        stroke="url(#voxelGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Discord Arc ("Discord" smooth circular geometry) -->
  <path d="M 280 138 A 112 118 0 0 1 280 374"
        stroke="url(#discordGrad)" stroke-width="36" stroke-linecap="round"/>

  <!-- Bidirectional Sync Chevrons / Bridge Bars (Minecraft <-> Discord) -->
  <!-- Top lane: Minecraft -> Discord -->
  <path d="M 190 232 L 306 232 M 286 210 L 312 232 L 286 254"
        stroke="url(#topLinkGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom lane: Discord -> Minecraft -->
  <path d="M 322 288 L 206 288 M 226 266 L 200 288 L 226 310"
        stroke="url(#botLinkGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
